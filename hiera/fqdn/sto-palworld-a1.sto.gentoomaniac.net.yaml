---
classes:
  - docker::run_instance

ressources:
  btrfs::subvolume:
    "/srv/palworld":
      ensure: present

docker::docker_users:
  - marco

docker::run_instance::instance:
  palworld:
    service_provider: systemd
    image: thijsvanloef/palworld-server-docker:latest
    command: >
      -port=8211
      -useperfthreads
      -NoAsyncLoadingThread
      -UseMultithreadForDS
    dns:
      - 10.1.1.52
      - 10.1.1.53
    env:
      - PUID=1000
      - PGID=1000
      - PORT=8211
      - PLAYERS=16
      - SERVER_PASSWORD=%{lookup('secret_palworld_server')}
      - REST_API_ENABLED=true
      - REST_API_PORT=8212
      - TZ=UTC
      - ADMIN_PASSWORD=%{lookup('secret_palworld_admin')}
      - COMMUNITY=true
      - SERVER_NAME=Our private Palworld server
      - SERVER_DESCRIPTION=You gotta pal'em all!
      - CROSSPLAY_PLATFORMS=(Steam,Xbox,PS5,Mac)
      - ITEM_WEIGHT_RATE=0.0
      - PAL_STOMACH_DECREASE_RATE=0.1
      - PLAYER_STOMACH_DECREASE_RATE=0.1
    ports:
      - 8211:8211/udp
      - 27015:27015/udp
      - 8212:8212/tcp
    extra_parameters:
      - --restart=unless-stopped
    pull_on_start: true
    volumes:
      - /srv/palworld:/palworld
    require:
      - Class[docker]
      - Btrfs::Subvolume[/srv/palworld]
