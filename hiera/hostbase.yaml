---
lookup_options:
  classes:
    merge: unique
  "^.*::.*":
    merge: deep

classes:
  - hostbase::autoupdate
  - hostbase::btrfs_scrub
  - hostbase::docker
  - hostbase::dotfiles
  - hostbase::journald
  - hostbase::maintenance
  - hostbase::metrics
  - hostbase::pacman
  - hostbase::packages
  - hostbase::puppet
  - hostbase::puppet_cron
  - hostbase::ssh
  - hostbase::vault
  - docker
  - docker::run_instance

docker::manage_package: false
docker::acknowledge_unsupported_os: true

network::ipv4::gateway: 10.1.1.1
network::ipv4::dns::servers:
  - 10.1.1.52
  - 10.1.1.53
network::ipv4::dns::search:
  - gentoomaniac.net
  - srv.gentoomaniac.net

hostbase::packages::present:
  - arch-audit
  - btop
  - btrfsmaintenance
  - docker
  - doggo
  - fzf
  - git
  - hwinfo
  - jq
  - less
  - lsb-release
  - mailutils
  - mbuffer
  - neovim
  - openssh
  - pacman-contrib
  - unzip
  - vault
  - which

hostbase::packages::absent:
  - fakeroot
  - go
  - npm

dns::servers:
  - 10.1.1.53

dotfiles:
  "marco": {}
  "root": {}

hostbase::ssh::authorized_keys:
  marco:
    - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIESaPVR26gxGnwaomoRcdipNTNC7jxn7TO7Pb+FmECnL marco@gentoobox.clients.gentoomaniac.net
    - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAxSYdM4DORK2/koKHlz9nWuDclxIKIhlXoQTKdEnz67 marco@marcos-desktop
    - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICU8Rd9oxln9cdIJVhzsDPcBY3qQZfkiNgg+U3gT4zwj marco@mbrk-gentoo
  root:
    - 
    - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIESaPVR26gxGnwaomoRcdipNTNC7jxn7TO7Pb+FmECnL marco@gentoobox.clients.gentoomaniac.net
    - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAxSYdM4DORK2/koKHlz9nWuDclxIKIhlXoQTKdEnz67 marco@marcos-desktop
    - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICU8Rd9oxln9cdIJVhzsDPcBY3qQZfkiNgg+U3gT4zwj marco@mbrk-gentoo

resources:
  file:
    # "/var/lib/puppet/reports":
    #   ensure: absent
    #   force: true
    "/srv":
      ensure: directory

docker::docker_users:
  - marco

docker::run_instance::instance:
  nodexporter:
    service_provider: systemd
    image: quay.io/prometheus/node-exporter:latest
    command: >
      --path.rootfs=/host
    extra_parameters:
      - --restart=unless-stopped
      - --pid="host"
    expose:
      - 9100/tcp
    net:
      - host
    pull_on_start: true
    require:
      - Package[docker]
      - Class[docker]
    volumes:
      - /:/host:ro,rslave
  cadvisor:
    service_provider: systemd
    image: gcr.io/cadvisor/cadvisor:latest
    extra_parameters:
      - --restart=unless-stopped
      - --pid="host"
      - --device=/dev/kmsg
    ports:
      - "9101:8080/tcp"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    require:
      - Class[docker]
