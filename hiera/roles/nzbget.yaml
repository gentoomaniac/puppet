---
classes:
  - docker::networks
  - docker::volumes
  - docker::run_instance
  - traefik

resources:
  btrfs::subvolume:
    "/srv/nzbget":
      ensure: present
  file:
    "/srv/nzbget/config":
      ensure: directory
      owner: 1000
      group: 1000
      require: Btrfs::Subvolume[/srv/nzbget]

# NFS shares on the NAS, reached over the direct fiber link (ens19, 192.168.0.0/24)
docker::volumes::volumes:
  nfs_movies:
    ensure: present
    driver: local
    options:
      - - type=nfs
        - o=addr=192.168.0.5,nolock,soft,bg,tcp,intr,rsize=131072,wsize=131072,noatime,rw
        - device=:/mnt/movies/movies
  nfs_music:
    ensure: present
    driver: local
    options:
      - - type=nfs
        - o=addr=192.168.0.5,nolock,soft,bg,tcp,intr,rsize=131072,wsize=131072,noatime,rw
        - device=:/mnt/movies/music
  nfs_kids_movies:
    ensure: present
    driver: local
    options:
      - - type=nfs
        - o=addr=192.168.0.5,nolock,soft,bg,tcp,intr,rsize=131072,wsize=131072,noatime,rw
        - device=:/mnt/tank0/kids_movies
  nfs_shows:
    ensure: present
    driver: local
    options:
      - - type=nfs
        - o=addr=192.168.0.5,nolock,soft,bg,tcp,intr,rsize=131072,wsize=131072,noatime,rw
        - device=:/mnt/shows/shows
  nfs_kids_shows:
    ensure: present
    driver: local
    options:
      - - type=nfs
        - o=addr=192.168.0.5,nolock,soft,bg,tcp,intr,rsize=131072,wsize=131072,noatime,rw
        - device=:/mnt/tank0/kids_shows
  nfs_nzbget:
    ensure: present
    driver: local
    options:
      - - type=nfs
        - o=addr=192.168.0.5,nolock,soft,bg,tcp,intr,rsize=131072,wsize=131072,noatime,rw
        - device=:/mnt/tmp/nzbget
  nfs_ebooks:
    ensure: present
    driver: local
    options:
      - - type=nfs
        - o=addr=192.168.0.5,nolock,soft,bg,tcp,intr,rsize=131072,wsize=131072,noatime,rw
        - device=:/mnt/shows/ebooks

docker::docker_users:
  - marco

docker::networks::networks:
  web:
    ensure: "present"

traefik::certificates:
  srv_gentoomaniac_net:
    cert: secret_srv_gentoomaniac_net_cert
    key: secret_srv_gentoomaniac_net_key
traefik::default_certificate: srv_gentoomaniac_net
traefik::entrypoints:
  websecure: ":443"
traefik::ports:
  - 443:443/tcp

docker::run_instance::instance:
  nzbget:
    service_provider: systemd
    image: linuxserver/nzbget:latest
    env:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
    expose:
      - 6789/tcp
    extra_parameters:
      - --restart=unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.nzbget.rule=Host(`nzbget.srv.gentoomaniac.net`)
      - traefik.http.routers.nzbget.entrypoints=websecure
      - traefik.http.routers.nzbget.tls=true
      - traefik.http.middlewares.nzbget-allowlist.ipallowlist.sourcerange=10.1.1.0/24,192.168.0.0/16
      - traefik.http.routers.nzbget.middlewares=nzbget-allowlist
      - traefik.http.services.nzbget.loadbalancer.server.port=6789
    net:
      - web
    pull_on_start: true
    volumes:
      - /srv/nzbget/config:/config
      - nfs_nzbget:/downloads
      - nfs_movies:/movies
      - nfs_music:/music
      - nfs_shows:/shows
      - nfs_kids_movies:/kids_movies
      - nfs_kids_shows:/kids_shows
      - nfs_ebooks:/ebooks
    require:
      - Class[docker]
      - Docker_network[web]
      - Docker_volume[nfs_movies]
      - Docker_volume[nfs_music]
      - Docker_volume[nfs_shows]
      - Docker_volume[nfs_kids_movies]
      - Docker_volume[nfs_kids_shows]
      - Docker_volume[nfs_nzbget]
      - Docker_volume[nfs_ebooks]
      - File[/srv/nzbget/config]
