---
classes:
  - docker::networks
  - docker::run_instance
  - traefik
  - docker::volumes
  - arch_pkg_host
  - kickstart_nginx
  - certbot

certbot::domains:
  - "*.srv.gentoomaniac.net"
  - "*.gentoomaniac.net"

resources:
  package:
    "fail2ban":
      ensure: installed
    "bind":
      ensure: installed

  btrfs::subvolume:
    "/srv/authelia":
      ensure: present
    "/srv/nextcloud":
      ensure: present
    "/srv/nextcloud/html":
      ensure: present
      require: Btrfs::Subvolume[/srv/nextcloud]
    "/srv/mariadb":
      ensure: present

  file:
    "/srv/authelia/config":
      ensure: directory
      require: Btrfs::Subvolume[/srv/authelia]
    "/etc/clouddns-updater-key.json":
      ensure: present
      mode: "0600"
      content: "%{lookup('secret_cloud_dns')}"
    "/usr/local/bin/clouddns-update":
      ensure: present
      mode: "0750"
      content: |
        #! /bin/env bash

        DNS_NAMES="vpn.gentoomaniac.net windrose.gentoomaniac.net palworld.gentoomaniac.net wor-timeline.gentoomaniac.net"
        PROJECT="gentoomaniac-net"
        SERVICE_ACCOUNT_NAME="dns-updates@gentoomaniac-net.iam.gserviceaccount.com"
        ZONE="gentoomaniac-net"
        IMAGE_NAME="google/cloud-sdk:alpine"

        CURRENT_IP="$(dig +short myip.opendns.com @resolver1.opendns.com)"

        for DNS_NAME in ${DNS_NAMES}; do
          OLD_IP="$(dig +short "${DNS_NAME}")"
          if [ "${OLD_IP}" != "${CURRENT_IP}" ]; then
              docker pull "${IMAGE_NAME}"
              docker run --rm -e GOOGLE_APPLICATION_CREDENTIALS=/key.json -v "clouddns-config:/root/.config" -v "clouddns-kube:/root/.kube" -v /etc/clouddns-updater-key.json:/key.json:ro "${IMAGE_NAME}" gcloud auth activate-service-account "${SERVICE_ACCOUNT_NAME}" --key-file=/key.json --project="${PROJECT}"
              docker run --rm -v "clouddns-config:/root/.config" -v "clouddns-kube:/root/.kube" "${IMAGE_NAME}" gcloud dns record-sets update "${DNS_NAME}" --rrdatas="${CURRENT_IP}" --type=A --zone="${ZONE}" --account="${SERVICE_ACCOUNT_NAME}"
          fi
        done
      require:
        - Docker_volume[clouddns-config]
        - Docker_volume[clouddns-kube]

    "/srv/authelia/config/configuration.yml":
      ensure: 'file'
      require: File[/srv/authelia/config]
      content: |
        theme: auto
        server:
          host: 0.0.0.0
          port: 9091

        log:
          level: info

        # SECURITY KEYS (Change these to long, random strings in production!)
        jwt_secret: 'a_very_secret_string_change_me'

        default_2fa_method: 'totp'

        authentication_backend:
          file:
            path: /config/users.yml
            password:
              algorithm: argon2id

        session:
          name: authelia_session
          domain: srv.gentoomaniac.net  # The magic SSO domain
          secret: 'another_very_secret_string_change_me'
          expiration: 1h
          inactivity: 15m
          remember_me_duration: 1M

        storage:
          # Encryption key MUST be > 20 characters
          encryption_key: 'a_string_that_must_be_more_than_twenty_characters_long'
          local:
            path: /config/db.sqlite3

        notifier:
          smtp:
            address: "smtp://smtp.gmail.com:587"
            username: marco@siebecke.se
            password: %{lookup('secret_google_smtp')}
            sender: "Authelia <no-reply@siebecke.se>"
            subject: "[Authelia] {title}"

        access_control:
          # Default is deny all, then we punch holes
          default_policy: deny
          rules:
            # Require 2FA for all apps under your domain
            - domain: '*.srv.gentoomaniac.net'
              policy: two_factor

  timer:
    "clouddns-updater":
      description: Update clouddns entries hourly if necessary
      command: /usr/local/bin/clouddns-update
      on_calendar: hourly
      require:
        - File[/etc/clouddns-updater-key.json]
        - File[/usr/local/bin/clouddns-update]
  service:
    "fail2ban":
      ensure: running
      enable: true
      require: Package[fail2ban]

docker::volumes::volumes:
  "clouddns-config":
    ensure: present
  "clouddns-kube":
    ensure: present

traefik::certificates:
  srv_gentoomaniac_net:
    cert: secret_srv_gentoomaniac_net_cert
    key: secret_srv_gentoomaniac_net_key
traefik::default_certificate: srv_gentoomaniac_net
traefik::entrypoints:
  web: ":80"
  ssl: ":443"
traefik::ports:
  - 80:80/tcp
  - 443:443/tcp
traefik::dynamic_configs:
  "static.toml": |
    [http.services]
      [http.services.dummy.loadBalancer]
        [[http.services.dummy.loadBalancer.servers]]
            url = ""

      [http.services.nas.loadBalancer]
        [[http.services.nas.loadBalancer.servers]]
          url = "https://10.1.1.5:443/"

      [http.services.unifi.loadBalancer]
        [[http.services.unifi.loadBalancer.servers]]
          url = "https://10.1.1.1:443/"

      [http.services.proxmox.loadBalancer]
        [[http.services.proxmox.loadBalancer.servers]]
          url = "https://sto-proxmox-a1.sto.gentoomaniac.net:8006/"

      [http.services.proxmox2.loadBalancer]
        [[http.services.proxmox2.loadBalancer.servers]]
          url = "https://sto-proxmox-a2.sto.gentoomaniac.net:8006/"

    [http.routers]
      [http.routers.redirect-to-https]
        rule = "hostregexp(`{host:.+}`)"
        service = "dummy"
        entryPoints = ["web"]
        middlewares = ["redirect-to-https"]

      [http.routers.nas]
        rule = "Host(`nas.srv.gentoomaniac.net`)"
        service = "nas"
        entryPoints = ["ssl"]
        middlewares = ["local-only-whitelist"]
        [http.routers.nas.tls]

      [http.routers.unifi]
        rule = "Host(`unifi.srv.gentoomaniac.net`)"
        service = "unifi"
        entryPoints = ["ssl"]
        middlewares = ["local-only-whitelist"]
        [http.routers.unifi.tls]

      [http.routers.proxmox]
        rule = "Host(`proxmox.srv.gentoomaniac.net`)"
        service = "proxmox"
        entryPoints = ["ssl"]
        middlewares = ["local-only-whitelist"]
        [http.routers.proxmox.tls]

    [http.middlewares]
      [http.middlewares.redirect-to-https]
        [http.middlewares.redirect-to-https.redirectscheme]
          scheme = "https"

      [http.middlewares.local-only-whitelist]
        [http.middlewares.local-only-whitelist.ipwhitelist]
          sourcerange = ["10.1.1.0/24","10.1.15.0/24"]

      [http.middlewares.sso.forwardAuth]
        address = "https://auth.srv.gentoomaniac.net"
        authResponseHeaders = ["X-Forwarded-User"]

docker::networks::networks:
  web:
    ensure: "present"

docker::run_instance::instance:
  authelia:
    service_provider: systemd
    image: 'authelia/authelia:latest'
    net:
      - web
    expose:
      - 9091/tcp
    labels:
      - traefik.enable=true
      - traefik.http.routers.authelia.rule=Host(`auth.srv.gentoomaniac.net`)
      - traefik.http.routers.authelia.entrypoints=ssl
      - traefik.http.routers.authelia.tls=true
      - traefik.http.middlewares.authelia-whitelist.ipwhitelist.sourcerange=10.1.1.0/24,192.168.3.0/24,172.16.0.0/12
      - traefik.http.routers.authelia.middlewares=authelia-whitelist
    volumes:
      - '/srv/authelia/config:/config'
    require:
      - Btrfs::Subvolume[/srv/authelia]
      - File[/srv/authelia/config/configuration.yml]
  mariadb:
    ensure: absent
    service_provider: systemd
    image: 'mariadb:10.6'
    net:
      - web
    labels:
      - traefik.enable=false
    volumes:
      - '/srv/mariadb:/var/lib/mysql'
    require:
      - Btrfs::Subvolume[/srv/mariadb]
  nextcloud:
    ensure: absent
    service_provider: systemd
    image: 'nextcloud'
    net:
      - web
    env:
      - OVERWRITEPROTOCOL=https                        # Forces Nextcloud to generate HTTPS links
      - OVERWRITEHOST=nextcloud.srv.gentoomaniac.net   # Forces Nextcloud to use your public domain
      - OVERWRITECLIURL=https://nextcloud.srv.gentoomaniac.net
    expose:
      - 80/tcp
    extra_parameters:
      - --link mariadb:mariadb
    labels:
      - traefik.enable=true
      - traefik.http.routers.nextcloud.rule=Host(`nextcloud.srv.gentoomaniac.net`)
      - traefik.http.routers.nextcloud.entrypoints=ssl
      - traefik.http.routers.nextcloud.tls=true
      - traefik.http.middlewares.nextcloud-whitelist.ipwhitelist.sourcerange=10.1.1.0/24,192.168.3.0/24,172.16.0.0/12
      - traefik.http.routers.nextcloud.middlewares=nextcloud-whitelist
    volumes:
      - '/srv/nextcloud:/var/www/html'
    require:
      - Btrfs::Subvolume[/srv/nextcloud/html]
      - Docker::Run[mariadb]

kickstart_nginx::labels:
  - traefik.enable=true
  - traefik.http.routers.ksnginx.rule=Host(`ks.srv.gentoomaniac.net`)
  - traefik.http.routers.ksnginx.entrypoints=ssl
  - traefik.http.routers.ksnginx.tls=true
  - traefik.http.middlewares.ksnginx-whitelist.ipwhitelist.sourcerange=10.1.1.0/24,192.168.3.0/24,172.16.0.0/12
  - traefik.http.routers.ksnginx.middlewares=ksnginx-whitelist
