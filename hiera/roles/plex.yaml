---
classes:
  - docker::networks
  - docker::volumes
  - docker::run_instance
  - traefik

resources:
  package:
    autofs:
      ensure: installed
    nfs-utils:
      ensure: installed

  btrfs::subvolume:
    "/srv/radarr":
      ensure: present
    "/srv/radarr-kids":
      ensure: present
    "/srv/readarr":
      ensure: present
    "/srv/sonarr":
      ensure: present
    "/srv/sonarr-kids":
      ensure: present
    "/srv/lidarr":
      ensure: present
    "/srv/tautulli":
      ensure: present
    "/srv/plex":
      ensure: present
    "/srv/ytdl":
      ensure: present

  file:
    # NAS shares for use on the host, mounted on demand below /nfs
    "/etc/autofs/auto.nfs":
      ensure: present
      content: |
        ebooks  -soft,intr,rsize=8192,wsize=8192,noatime,uid=marco,gid=marco 10.1.1.5:/mnt/shows/ebooks
        movies  -soft,intr,rsize=8192,wsize=8192,noatime,uid=marco,gid=marco 10.1.1.5:/mnt/movies/movies
        kids_movies  -soft,intr,rsize=8192,wsize=8192,noatime,uid=marco,gid=marco 10.1.1.5:/mnt/tank0/kids_movies
        shows  -soft,intr,rsize=8192,wsize=8192,noatime,uid=marco,gid=marco 10.1.1.5:/mnt/shows/shows
        kids_shows  -soft,intr,rsize=8192,wsize=8192,noatime,uid=marco,gid=marco 10.1.1.5:/mnt/tank0/kids_shows
        kids_shows_se  -soft,intr,rsize=8192,wsize=8192,noatime,uid=marco,gid=marco 10.1.1.5:/mnt/tank0/kids_shows_se
        kids_audio  -soft,intr,rsize=8192,wsize=8192,noatime,uid=marco,gid=marco 10.1.1.5:/mnt/tank0/kids_audio
        music  -soft,intr,rsize=8192,wsize=8192,noatime,uid=marco,gid=marco 10.1.1.5:/mnt/movies/music
        sd_old  -soft,intr,rsize=8192,wsize=8192,noatime,uid=marco,gid=marco 10.1.1.5:/mnt/shows/sd_old
        youtube-downloader  -soft,intr,rsize=8192,wsize=8192,noatime,uid=marco,gid=marco 10.1.1.5:/mnt/tank0/youtube-downloader

        docker  -rw,soft,intr,rsize=8192,wsize=8192,noatime 10.1.1.5:/mnt/bak/docker
        share  -rw,soft,intr,rsize=8192,wsize=8192,noatime 10.1.1.5:/mnt/tank5/share
        nzbget  -rw,soft,intr,rsize=8192,wsize=8192,noatime 10.1.1.5:/mnt/tmp/nzbget
        tftpboot  -rw,soft,intr,rsize=8192,wsize=8192,noatime 10.1.1.5:/mnt/shows/tftpboot
      require: Package[autofs]
      notify: Service[autofs]
    # Arch keeps the autofs config in /etc/autofs; replace the stock master map
    "/etc/autofs/auto.master":
      ensure: present
      content: |
        /nfs   /etc/autofs/auto.nfs --timeout 60
      require: Package[autofs]
      notify: Service[autofs]
    "/srv/plex/config":
      ensure: directory
      require: Btrfs::Subvolume[/srv/plex]
    "/srv/plex/transcode":
      ensure: directory
      require: Btrfs::Subvolume[/srv/plex]
    "/srv/ytdl/appdata":
      ensure: directory
      require: Btrfs::Subvolume[/srv/ytdl]
    "/srv/ytdl/audio":
      ensure: directory
      require: Btrfs::Subvolume[/srv/ytdl]
    "/srv/ytdl/video":
      ensure: directory
      require: Btrfs::Subvolume[/srv/ytdl]
    "/srv/ytdl/subscriptions":
      ensure: directory
      require: Btrfs::Subvolume[/srv/ytdl]

  service:
    autofs:
      ensure: running
      enable: true
      require:
        - Package[nfs-utils]
        - File[/etc/autofs/auto.nfs]
        - File[/etc/autofs/auto.master]
    # Plex does its own discovery, keep avahi off it
    avahi-daemon:
      ensure: stopped
      enable: false

docker::docker_users:
  - marco

docker::networks::networks:
  web:
    ensure: "present"

docker::volumes::volumes:
  nfs_movies:
    ensure: present
    driver: local
    options:
      - - type=nfs
        - o=addr=10.1.1.5,nolock,soft,bg,tcp,intr,rsize=8192,wsize=8192,noatime,rw
        - device=:/mnt/movies/movies
  nfs_kids_movies:
    ensure: present
    driver: local
    options:
      - - type=nfs
        - o=addr=10.1.1.5,nolock,soft,bg,tcp,intr,rsize=8192,wsize=8192,noatime,rw
        - device=:/mnt/tank0/kids_movies
  nfs_shows:
    ensure: present
    driver: local
    options:
      - - type=nfs
        - o=addr=10.1.1.5,nolock,soft,bg,tcp,intr,rsize=8192,wsize=8192,noatime,rw
        - device=:/mnt/shows/shows
  nfs_kids_shows:
    ensure: present
    driver: local
    options:
      - - type=nfs
        - o=addr=10.1.1.5,nolock,soft,bg,tcp,intr,rsize=8192,wsize=8192,noatime,rw
        - device=:/mnt/tank0/kids_shows
  nfs_kids_shows_se:
    ensure: present
    driver: local
    options:
      - - type=nfs
        - o=addr=10.1.1.5,nolock,soft,bg,tcp,intr,rsize=8192,wsize=8192,noatime,rw
        - device=:/mnt/tank0/kids_shows_se
  nfs_sd_old:
    ensure: present
    driver: local
    options:
      - - type=nfs
        - o=addr=10.1.1.5,nolock,soft,bg,tcp,intr,rsize=8192,wsize=8192,noatime,rw
        - device=:/mnt/shows/sd_old
  nfs_youtube_downloader:
    ensure: present
    driver: local
    options:
      - - type=nfs
        - o=addr=10.1.1.5,nolock,soft,bg,tcp,intr,rsize=8192,wsize=8192,noatime,rw
        - device=:/mnt/tank0/youtube-downloader
  nfs_music:
    ensure: present
    driver: local
    options:
      - - type=nfs
        - o=addr=10.1.1.5,nolock,soft,bg,tcp,intr,rsize=8192,wsize=8192,noatime,rw
        - device=:/mnt/movies/music
  nfs_ebooks:
    ensure: present
    driver: local
    options:
      - - type=nfs
        - o=addr=10.1.1.5,nolock,soft,bg,tcp,intr,rsize=8192,wsize=8192,noatime,rw
        - device=:/mnt/shows/ebooks

traefik::certificates:
  srv_gentoomaniac_net:
    cert: secret_srv_gentoomaniac_net_cert
    key: secret_srv_gentoomaniac_net_key
traefik::default_certificate: srv_gentoomaniac_net
traefik::entrypoints:
  websecure: ":443"
traefik::ports:
  - 443:443/tcp

docker::run_instance::instance:
  radarr:
    service_provider: systemd
    image: linuxserver/radarr:latest
    env:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
      - UMASK_SET=022
    expose:
      - 7878/tcp
    extra_parameters:
      - --restart=unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.radarr.rule=Host(`radarr.srv.gentoomaniac.net`)
      - traefik.http.routers.radarr.entrypoints=websecure
      - traefik.http.routers.radarr.tls=true
      - traefik.http.middlewares.radarr-allowlist.ipallowlist.sourcerange=10.1.1.0/24,192.168.3.0/24
      - traefik.http.routers.radarr.middlewares=radarr-allowlist
    net:
      - web
    pull_on_start: true
    volumes:
      - /srv/radarr:/config
      - nfs_movies:/movies
    require:
      - Class[docker]
      - Docker_network[web]
      - Btrfs::Subvolume[/srv/radarr]
      - Docker_volume[nfs_movies]
  radarr-kids:
    service_provider: systemd
    image: linuxserver/radarr:latest
    env:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
      - UMASK_SET=022
    expose:
      - 7878/tcp
    extra_parameters:
      - --restart=unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.radarr-kids.rule=Host(`radarr-kids.srv.gentoomaniac.net`)
      - traefik.http.routers.radarr-kids.entrypoints=websecure
      - traefik.http.routers.radarr-kids.tls=true
      - traefik.http.middlewares.radarr-kids-allowlist.ipallowlist.sourcerange=10.1.1.0/24,192.168.3.0/24
      - traefik.http.routers.radarr-kids.middlewares=radarr-kids-allowlist
    net:
      - web
    pull_on_start: true
    volumes:
      - /srv/radarr-kids:/config
      - nfs_kids_movies:/kids_movies
    require:
      - Class[docker]
      - Docker_network[web]
      - Btrfs::Subvolume[/srv/radarr-kids]
      - Docker_volume[nfs_kids_movies]
  sonarr:
    service_provider: systemd
    image: linuxserver/sonarr:latest
    env:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
      - UMASK_SET=022
    expose:
      - 8989/tcp
    extra_parameters:
      - --restart=unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.sonarr.rule=Host(`sonarr.srv.gentoomaniac.net`)
      - traefik.http.routers.sonarr.entrypoints=websecure
      - traefik.http.routers.sonarr.tls=true
      - traefik.http.middlewares.sonarr-allowlist.ipallowlist.sourcerange=10.1.1.0/24,192.168.3.0/24
      - traefik.http.routers.sonarr.middlewares=sonarr-allowlist
    net:
      - web
    pull_on_start: true
    volumes:
      - /srv/sonarr:/config
      - nfs_shows:/shows
    require:
      - Class[docker]
      - Docker_network[web]
      - Btrfs::Subvolume[/srv/sonarr]
      - Docker_volume[nfs_shows]
  sonarr-kids:
    service_provider: systemd
    image: linuxserver/sonarr:latest
    env:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
      - UMASK_SET=022
    expose:
      - 8989/tcp
    extra_parameters:
      - --restart=unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.sonarr-kids.rule=Host(`sonarr-kids.srv.gentoomaniac.net`)
      - traefik.http.routers.sonarr-kids.entrypoints=websecure
      - traefik.http.routers.sonarr-kids.tls=true
      - traefik.http.middlewares.sonarr-kids-allowlist.ipallowlist.sourcerange=10.1.1.0/24,192.168.3.0/24
      - traefik.http.routers.sonarr-kids.middlewares=sonarr-kids-allowlist
    net:
      - web
    pull_on_start: true
    volumes:
      - /srv/sonarr-kids:/config
      - nfs_kids_shows:/shows
    require:
      - Class[docker]
      - Docker_network[web]
      - Btrfs::Subvolume[/srv/sonarr-kids]
      - Docker_volume[nfs_kids_shows]
  lidarr:
    service_provider: systemd
    image: linuxserver/lidarr:latest
    env:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
      - UMASK_SET=022
    expose:
      - 8686/tcp
    extra_parameters:
      - --restart=unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.lidarr.rule=Host(`lidarr.srv.gentoomaniac.net`)
      - traefik.http.routers.lidarr.entrypoints=websecure
      - traefik.http.routers.lidarr.tls=true
      - traefik.http.middlewares.lidarr-allowlist.ipallowlist.sourcerange=10.1.1.0/24,192.168.3.0/24
      - traefik.http.routers.lidarr.middlewares=lidarr-allowlist
    net:
      - web
    pull_on_start: true
    volumes:
      - /srv/lidarr:/config
      - nfs_music:/music
    require:
      - Class[docker]
      - Docker_network[web]
      - Btrfs::Subvolume[/srv/lidarr]
      - Docker_volume[nfs_music]
  readarr:
    service_provider: systemd
    image: linuxserver/readarr:0.4.15-nightly
    env:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
      - UMASK_SET=022
    expose:
      - 8787/tcp
    extra_parameters:
      - --restart=unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.readarr.rule=Host(`readarr.srv.gentoomaniac.net`)
      - traefik.http.routers.readarr.entrypoints=websecure
      - traefik.http.routers.readarr.tls=true
      - traefik.http.middlewares.readarr-allowlist.ipallowlist.sourcerange=10.1.1.0/24,192.168.3.0/24
      - traefik.http.routers.readarr.middlewares=readarr-allowlist
    net:
      - web
    pull_on_start: true
    volumes:
      - /srv/readarr:/config
      - nfs_ebooks:/ebooks
    require:
      - Class[docker]
      - Docker_network[web]
      - Btrfs::Subvolume[/srv/readarr]
      - Docker_volume[nfs_ebooks]
  tautulli:
    service_provider: systemd
    image: linuxserver/tautulli:latest
    expose:
      - 8181/tcp
    extra_parameters:
      - --restart=unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.tautulli.rule=Host(`tautulli.srv.gentoomaniac.net`)
      - traefik.http.routers.tautulli.entrypoints=websecure
      - traefik.http.routers.tautulli.tls=true
      - traefik.http.middlewares.tautulli-allowlist.ipallowlist.sourcerange=10.1.1.0/24,192.168.3.0/24
      - traefik.http.routers.tautulli.middlewares=tautulli-allowlist
    net:
      - web
    pull_on_start: true
    volumes:
      - /srv/tautulli:/config
    require:
      - Class[docker]
      - Docker_network[web]
      - Btrfs::Subvolume[/srv/tautulli]
  plex:
    service_provider: systemd
    image: plexinc/pms-docker:latest
    env:
      - TZ=Europe/Berlin
      # GID of the host's video group on Arch, for HW transcoding once /dev/dri is passed through
      - PLEX_GID=983
    labels:
      - traefik.enable=false
    ports:
      - 32400:32400/tcp
      - 1900:1900/udp
      - 3005:3005/tcp
      #- 5353:5353/udp
      - 8324:8324/tcp
      - 32410:32410/tcp
      - 32412-32414:32412-32414/udp
      - 32469:32469/tcp
    extra_parameters:
      - --restart=unless-stopped
    pull_on_start: true
    volumes:
      - /srv/plex/config:/config
      - /srv/plex/transcode:/transcode
      - nfs_movies:/data/movies:ro
      - nfs_shows:/data/shows:ro
      - nfs_kids_movies:/data/kids_movies:ro
      - nfs_kids_shows:/data/kids_shows:ro
      - nfs_kids_shows_se:/data/kids_shows_se:ro
      - nfs_sd_old:/data/sd_old:ro
      - nfs_music:/data/music:ro
      - nfs_youtube_downloader:/data/youtube:ro
    require:
      - Class[docker]
      - File[/srv/plex/config]
      - File[/srv/plex/transcode]
      - Docker_volume[nfs_movies]
      - Docker_volume[nfs_shows]
      - Docker_volume[nfs_kids_movies]
      - Docker_volume[nfs_kids_shows]
      - Docker_volume[nfs_kids_shows_se]
      - Docker_volume[nfs_sd_old]
      - Docker_volume[nfs_music]
      - Docker_volume[nfs_youtube_downloader]
      - Service[avahi-daemon]
  youtube-dl:
    service_provider: systemd
    image: ghcr.io/voc0der/youtubedl-material:nightly
    env:
      - ALLOW_CONFIG_MUTATIONS=true
    expose:
      - 443/tcp
    extra_parameters:
      - --restart=unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.ytdl.rule=Host(`youtube-dl.srv.gentoomaniac.net`)
      - traefik.http.routers.ytdl.entrypoints=websecure
      - traefik.http.routers.ytdl.tls=true
      - traefik.http.middlewares.ytdl-allowlist.ipallowlist.sourcerange=10.1.1.0/24,192.168.3.0/24
      - traefik.http.routers.ytdl.middlewares=ytdl-allowlist
    net:
      - web
    pull_on_start: true
    volumes:
      - /srv/ytdl/appdata:/app/appdata
      - /srv/ytdl/audio:/app/audio
      - /srv/ytdl/video:/app/video
      - /srv/ytdl/subscriptions:/app/subscriptions
      - nfs_youtube_downloader:/app/users
    require:
      - Class[docker]
      - Docker_network[web]
      - File[/srv/ytdl/appdata]
      - File[/srv/ytdl/audio]
      - File[/srv/ytdl/video]
      - File[/srv/ytdl/subscriptions]
      - Docker_volume[nfs_youtube_downloader]
