docker::docker_users:
  - marco

docker::networks::networks:
  web:
    ensure: "present"

traefik::certificates:
  srv_gentoomaniac_net:
    cert: secret_srv_gentoomaniac_net_cert
    key: secret_srv_gentoomaniac_net_key
traefik::default_certificate: srv_gentoomaniac_net
traefik::entrypoints:
  ssl: ":443"
  tempo: ":3200"
  otel: ":4318"
  webhook: ":8000"
traefik::ports:
  - 443:443/tcp
  - 3200:3200/tcp
  - 4318:4318/tcp
  - 8000:8000/tcp

docker::run_instance::instance:
  tempo:
    service_provider: systemd
    image: grafana/tempo:latest
    command: >
      --config.file=/etc/tempo.yaml
    expose:
      - 3200/tcp
      - 4318/tcp
    extra_parameters:
      - --restart=unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.tempo.rule=Host(`tempo.srv.gentoomaniac.net`)
      - traefik.http.routers.tempo.entrypoints=tempo
      - traefik.http.routers.tempo.tls=true
      - traefik.http.routers.tempo.service=tempo@docker
      - traefik.http.routers.tempo.middlewares=tempo-allowlist
      - traefik.http.services.tempo.loadbalancer.server.port=3200
      - traefik.http.middlewares.tempo-allowlist.ipallowlist.sourcerange=10.1.1.0/24,192.168.0.0/16,172.16.0.0/12
      - traefik.http.routers.tempo-otelhttp.rule=Host(`tempo-otelhttp.srv.gentoomaniac.net`)
      - traefik.http.routers.tempo-otelhttp.entrypoints=otel
      - traefik.http.routers.tempo-otelhttp.tls=true
      - traefik.http.routers.tempo-otelhttp.service=tempo-otelhttp@docker
      - traefik.http.routers.tempo-otelhttp.middlewares=tempo-allowlist
      - traefik.http.services.tempo-otelhttp.loadbalancer.server.port=4318
    net:
      - web
    pull_on_start: true
    volumes:
      - /srv/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - /srv/tempo/data:/var/tempo
    require:
      - Class[docker]
      - Docker_network[web]
      - File[/srv/tempo/tempo.yaml]
      - File[/srv/tempo/data]

  prometheus:
    service_provider: systemd
    image: prom/prometheus:latest
    command: >
      --web.enable-remote-write-receiver
      --config.file=/etc/prometheus/prometheus.yml
      --enable-feature=native-histograms
      --storage.tsdb.retention.time=10y
    extra_parameters:
      - --restart=unless-stopped
    labels:
      - traefik.enable=false
    net:
      - web
    ports:
      - 9090:9090/tcp
    pull_on_start: true
    volumes:
      - /srv/prometheus/data:/prometheus
      - /srv/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    require:
      - Class[docker]
      - Docker_network[web]
      - File[/srv/prometheus/data]
      - File[/srv/prometheus/prometheus.yml]

  # scripts push metrics here, e.g.
  #   echo "backup_last_success $(date +%s)" | curl --data-binary @- \
  #     https://pushgateway.srv.gentoomaniac.net/metrics/job/backup/instance/$(hostname)
  pushgateway:
    service_provider: systemd
    image: prom/pushgateway:latest
    command: >
      --persistence.file=/data/pushgateway.db
      --persistence.interval=1m
    expose:
      - 9091/tcp
    extra_parameters:
      - --restart=unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.pushgateway.rule=Host(`pushgateway.srv.gentoomaniac.net`)
      - traefik.http.routers.pushgateway.entrypoints=ssl
      - traefik.http.routers.pushgateway.tls=true
      - traefik.http.routers.pushgateway.middlewares=pushgateway-allowlist
      - traefik.http.services.pushgateway.loadbalancer.server.port=9091
      - traefik.http.middlewares.pushgateway-allowlist.ipallowlist.sourcerange=10.1.1.0/24,192.168.0.0/16,172.16.0.0/12
    net:
      - web
    pull_on_start: true
    volumes:
      - /srv/pushgateway/data:/data
    require:
      - Class[docker]
      - Docker_network[web]
      - File[/srv/pushgateway/data]

  grafana:
    service_provider: systemd
    image: grafana/grafana:latest
    username: 1000:1000
    env:
      - GF_SERVER_ROOT_URL=https://grafana.srv.gentoomaniac.net
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource,grafana-worldmap-panel,grafana-piechart-panel,vonage-status-panel,doitintl-bigquery-datasource
      - GF_RENDERING_SERVER_URL=http://renderer:8081/render
      - GF_RENDERING_CALLBACK_URL=http://grafana:3000/
      - GF_RENDERING_RENDERER_TOKEN=%{lookup('secret_grafana_renderer_token')}
      - GF_LOG_FILTERS=rendering:debug
    expose:
      - 3000/tcp
    extra_parameters:
      - --restart=unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`grafana.srv.gentoomaniac.net`)
      - traefik.http.routers.grafana.entrypoints=ssl
      - traefik.http.routers.grafana.tls=true
      - traefik.http.routers.grafana.middlewares=grafana-allowlist
      - traefik.http.services.grafana.loadbalancer.server.port=3000
      - traefik.http.middlewares.grafana-allowlist.ipallowlist.sourcerange=10.1.1.0/24,192.168.0.0/16,172.16.0.0/12
    net:
      - web
    pull_on_start: true
    volumes:
      - /srv/grafana:/var/lib/grafana
    require:
      - Class[docker]
      - Docker_network[web]
      - File[/srv/grafana]

  renderer:
    service_provider: systemd
    image: grafana/grafana-image-renderer:latest
    env:
      - ENABLE_METRICS=true
      - AUTH_TOKEN=%{lookup('secret_grafana_renderer_token')}
    expose:
      - 8081/tcp
    extra_parameters:
      - --restart=unless-stopped
    net:
      - web
    pull_on_start: true
    require:
      - Class[docker]
      - Docker_network[web]

  # receives TrueNAS graphite metrics on 2003, scraped by prometheus on 9108
  graphite-exporter:
    service_provider: systemd
    image: prom/graphite-exporter:latest
    command: >
      --graphite.mapping-config=/tmp/mappings.conf
    extra_parameters:
      - --restart=unless-stopped
    ports:
      - 9108:9108/tcp
      - 2003:9109/tcp
      - 2003:9109/udp
    pull_on_start: true
    volumes:
      - /srv/graphite-exporter/mappings.conf:/tmp/mappings.conf:ro
    require:
      - Class[docker]
      - File[/srv/graphite-exporter/mappings.conf]

  otelcol:
    service_provider: systemd
    image: otel/opentelemetry-collector:0.109.0
    expose:
      - 4318/tcp
    extra_parameters:
      - --restart=unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.otelcol.rule=Host(`otelcol.srv.gentoomaniac.net`)
      - traefik.http.routers.otelcol.entrypoints=otel
      - traefik.http.routers.otelcol.tls=true
      - traefik.http.routers.otelcol.service=otelcol@docker
      - traefik.http.routers.otelcol.middlewares=otelcol-allowlist
      - traefik.http.services.otelcol.loadbalancer.server.port=4318
      - traefik.http.middlewares.otelcol-allowlist.ipallowlist.sourcerange=10.1.1.0/24,192.168.0.0/16,172.16.0.0/12
    net:
      - web
    pull_on_start: true
    volumes:
      - /srv/otelcol/config.yaml:/etc/otelcol/config.yaml:ro
    require:
      - Class[docker]
      - Docker_network[web]
      - File[/srv/otelcol/config.yaml]

  # Shelly devices post to the webhook entrypoint (:8000) by name or by this host's IP
  shelly-exporter:
    service_provider: systemd
    image: ghcr.io/gentoomaniac/shelly-exporter:v0.1.1-amd64
    command: >
      -vv
      --config-file /etc/shelly-exporter.yaml
    expose:
      - 8080/tcp
    extra_parameters:
      - --restart=unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.middlewares.shelly-exporter-allowlist.ipallowlist.sourcerange=10.1.1.0/24,10.1.3.0/24,192.168.0.0/16,172.16.0.0/12
      - traefik.http.routers.shelly-exporter.rule=Host(`shelly-exporter.srv.gentoomaniac.net`)
      - traefik.http.routers.shelly-exporter.entrypoints=webhook
      - traefik.http.routers.shelly-exporter.service=shelly-exporter@docker
      - traefik.http.routers.shelly-exporter.middlewares=shelly-exporter-allowlist
      - traefik.http.services.shelly-exporter.loadbalancer.server.port=8080
      - traefik.http.routers.shelly-exporter-https.rule=Host(`shelly-exporter.srv.gentoomaniac.net`)
      - traefik.http.routers.shelly-exporter-https.entrypoints=ssl
      - traefik.http.routers.shelly-exporter-https.tls=true
      - traefik.http.routers.shelly-exporter-https.service=shelly-exporter@docker
      - traefik.http.routers.shelly-exporter-https.middlewares=shelly-exporter-allowlist
      - traefik.http.routers.shelly-exporter-ip.rule=Host(`10.1.1.57`)
      - traefik.http.routers.shelly-exporter-ip.entrypoints=webhook
      - traefik.http.routers.shelly-exporter-ip.service=shelly-exporter@docker
      - traefik.http.routers.shelly-exporter-ip.middlewares=shelly-exporter-allowlist
    net:
      - web
    pull_on_start: true
    volumes:
      - /srv/shelly-exporter/config.yaml:/etc/shelly-exporter.yaml:ro
    require:
      - Class[docker]
      - Docker_network[web]
      - File[/srv/shelly-exporter/config.yaml]
