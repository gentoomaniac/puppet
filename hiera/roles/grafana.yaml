---
classes:
  - docker::networks
  - docker::run_instance
  - traefik

resources:
  btrfs::subvolume:
    "/srv/grafana":
      ensure: present
    "/srv/graphite-exporter":
      ensure: present
    "/srv/otelcol":
      ensure: present
    "/srv/prometheus":
      ensure: present
    "/srv/pushgateway":
      ensure: present
    "/srv/shelly-exporter":
      ensure: present
    "/srv/tempo":
      ensure: present
  file:
    # grafana runs as 1000:1000 and writes straight into /srv/grafana
    "/srv/grafana":
      ensure: directory
      owner: 1000
      group: 1000
      require: Btrfs::Subvolume[/srv/grafana]
    "/srv/tempo/data":
      ensure: directory
      owner: 10001
      group: 10001
      require: Btrfs::Subvolume[/srv/tempo]
    "/srv/tempo/tempo.yaml":
      ensure: present
      content: |
        stream_over_http_enabled: true
        server:
          http_listen_port: 3200
          log_level: warn

        query_frontend:
          search:
            duration_slo: 5s
            throughput_bytes_slo: 1.073741824e+09
          trace_by_id:
            duration_slo: 5s

        distributor:
          receivers:                           # this configuration will listen on all ports and protocols that tempo is capable of.
            otlp:
              protocols:
                http:
                grpc:

        ingester:
          max_block_duration: 5m               # cut the headblock when this much time passes. this is being set for demo purposes and should probably be left alone normally

        compactor:
          compaction:
            block_retention: 2160h                # 90d

        metrics_generator:
          registry:
            external_labels:
              source: tempo
              cluster: docker-compose
          storage:
            path: /var/tempo/generator/wal
            remote_write:
              - url: http://prometheus.srv.gentoomaniac.net:9090/api/v1/write
                send_exemplars: true
          traces_storage:
            path: /var/tempo/generator/traces

        storage:
          trace:
            backend: local                     # backend configuration to use
            wal:
              path: /var/tempo/wal             # where to store the wal locally
            local:
              path: /var/tempo/blocks

        overrides:
          defaults:
            metrics_generator:
              processors: [service-graphs, span-metrics, local-blocks] # enables metrics generator
              generate_native_histograms: both
      require: Btrfs::Subvolume[/srv/tempo]
      notify: Docker::Run[tempo]
    # prom/prometheus runs as nobody (65534); Arch has no "nogroup"
    "/srv/prometheus/data":
      ensure: directory
      owner: 65534
      group: 65534
      require: Btrfs::Subvolume[/srv/prometheus]
    # pushgateway also runs as nobody; keeps pushed metrics across restarts
    "/srv/pushgateway/data":
      ensure: directory
      owner: 65534
      group: 65534
      require: Btrfs::Subvolume[/srv/pushgateway]
    "/srv/prometheus/prometheus.yml":
      ensure: present
      content: |
        global:
          scrape_interval: 15s # Set the scrape interval to every 15 seconds. Default is every 1 minute.
          evaluation_interval: 15s # Evaluate rules every 15 seconds. The default is every 1 minute.
          # scrape_timeout is set to the global default (10s).

        # Alertmanager configuration
        alerting:
          alertmanagers:
            - static_configs:
                - targets:
                  # - alertmanager:9093

        # Load rules once and periodically evaluate them according to the global 'evaluation_interval'.
        rule_files:

        scrape_configs:
          - job_name: "prometheus"
            static_configs:
              - targets:
                - localhost:9090
          - job_name: "nodeexporter"
            static_configs:
              - targets:
                - sto-coredns-a1.sto.gentoomaniac.net:9100
                - sto-coredns-c1.sto.gentoomaniac.net:9100
                - sto-dev-a1.sto.gentoomaniac.net:9100
                - sto-grafana-b1.sto.gentoomaniac.net:9100
                - sto-homeassistant-a1.sto.gentoomaniac.net:9100
                - sto-infra-b1.sto.gentoomaniac.net:9100
                - sto-nzbget-a1.sto.gentoomaniac.net:9100
                - sto-nzbget-b1.sto.gentoomaniac.net:9100
                - sto-palworld-a1.sto.gentoomaniac.net:9100
                - sto-plex-a1.sto.gentoomaniac.net:9100
                - sto-proxmox-a1.sto.gentoomaniac.net:9100
                - sto-vault-a1.sto.gentoomaniac.net:9100
                - sto-vault-b1.sto.gentoomaniac.net:9100
          - job_name: "cadvisor"
            static_configs:
              - targets:
                - sto-coredns-a1.sto.gentoomaniac.net:9101
                - sto-coredns-c1.sto.gentoomaniac.net:9101
                - sto-dev-a1.sto.gentoomaniac.net:9101
                - sto-grafana-b1.sto.gentoomaniac.net:9101
                - sto-homeassistant-a1.sto.gentoomaniac.net:9101
                - sto-infra-b1.sto.gentoomaniac.net:9101
                - sto-nzbget-b1.sto.gentoomaniac.net:9101
                - sto-palworld-a1.sto.gentoomaniac.net:9101
                - sto-vault-b1.sto.gentoomaniac.net:9101
          - job_name: "traefik"
            static_configs:
              - targets:
                - sto-dev-a1.sto.gentoomaniac.net:8080
                - sto-grafana-b1.sto.gentoomaniac.net:8080
                - sto-infra-b1.sto.gentoomaniac.net:8080
                - sto-nzbget-a1.sto.gentoomaniac.net:8080
                - sto-nzbget-b1.sto.gentoomaniac.net:8080
                - sto-plex-a1.sto.gentoomaniac.net:8080
                - sto-vault-b1.sto.gentoomaniac.net:8080
          - job_name: "coredns"
            static_configs:
              - targets:
                - sto-coredns-a1.sto.gentoomaniac.net:9153
                - sto-coredns-c1.sto.gentoomaniac.net:9153
          - job_name: "freenas"
            static_configs:
              - targets:
                - sto-grafana-b1.sto.gentoomaniac.net:9108
          - job_name: "iot"
            scheme: https
            static_configs:
              - targets:
                - shelly-exporter.srv.gentoomaniac.net:443
          # metrics pushed by scripts; honor_labels keeps their job/instance labels
          - job_name: "pushgateway"
            honor_labels: true
            static_configs:
              - targets:
                - pushgateway:9091
      require: Btrfs::Subvolume[/srv/prometheus]
      notify: Docker::Run[prometheus]
    "/srv/graphite-exporter/mappings.conf":
      ensure: present
      content: |
        mappings:

        ############################################
        # cpu
        #
        # servers.HOST.cpu.1.percent.nice
        # servers.HOST.cpu.0.cpu.idle
        #
        # Note: 'gauge' or 'cpu' part depends
        # on 'Report CPU usage in percent' setting
        ############################################

        - match: "servers.*.cpu.*.*.*"
          name: "cpu"
          labels:
            job: "truenas"
            instance: "${1}"
            cpu_id: "${2}"
            stat_type: ${3}
            state: ${4}

        ######################################
        # cputemp
        #
        # servers.HOST.cputemp.2.temperature
        ######################################

        - match: "servers.*.cputemp.*.*"
          name: "cputemp_${3}"
          labels:
            job: "truenas"
            instance: "${1}"
            cpu_id: "${2}"

        ###################################################
        # CPU Aggregation
        #
        # servers.HOST.aggregation.cpu-sum.gauge.idle
        # servers.HOST.aggregation.cpu-average.gauge.nice
        # servers.HOST.aggregation.cpu-average.cpu.idle
        #
        # Note: 'gauge' or 'cpu' part depends
        # on 'Report CPU usage in percent' setting
        ###################################################

        - match: servers.*.aggregation.*.gauge.*
          name: aggregation_${2}
          labels:
            job: "truenas"
            instance: "${1}"
            state: ${3}
            stat_type: gauge

        - match: servers.*.aggregation.*.cpu.*
          name: aggregation_${2}
          labels:
            job: "truenas"
            instance: "${1}"
            state: ${3}
            stat_type: cpu


        #####################################################
        # Disk
        # servers.HOST.disk.sda2.pending_operations
        # servers.HOST.disk.sdc1.disk_ops.read
        ######################################################
        - match: "servers.*.disk.*.*"
          name: "disk_${3}"
          labels:
            instance: "${1}"
            job: "truenas"
            type: "disk"
            disk: "${2}"

        - match: "servers.*.disk.*.*.*"
          name: "disk_${3}_${4}"
          labels:
            instance: "${1}"
            job: "truenas"
            type: "disk"
            disk: "${2}"

        - match: "servers.*.disktemp.*.*"
          name: "disktemp_${3}"
          labels:
            instance: "${1}"
            job: "truenas"
            type: "disktemp"
            disk: "${2}"

        ############################################################
        # df
        # servers.HOST.df.var-lib-systemd-coredump.df_complex.free
        ############################################################
        - match: "servers.*.df.*.*.*"
          name: "${3}_${4}"
          labels:
            instance: "${1}"
            job: truenas
            type: df
            filesystem: "${2}"

        ########################################
        # Uptime
        #
        # servers.HOST.uptime.uptime
        ########################################

        - match: "servers.*.uptime.uptime"
          name: "uptime"
          labels:
            instance: "${1}"
            job: "truenas"

        ########################################
        # Memory
        #
        # servers.HOST.memory.memory.used
        ########################################
        - match: "servers.*.memory.*.*"
          name: "${2}_${3}"
          labels:
            instance: "${1}"
            job: "truenas"

        ########################################
        # Swap
        #
        # servers.HOST.swap.swap.used
        ########################################
        - match: "servers.*.swap.*.*"
          name: "${2}_${3}"
          labels:
            instance: "${1}"
            job: "truenas"

        ####################################################
        # processes_state
        #
        # servers.HOST.processes.ps_state.blocked
        ####################################################
        - match: "servers.*.processes.ps_state.*"
          name: "processes_state"
          labels:
            instance: "${1}"
            job: "truenas"
            state: "${2}"

        ####################################################
        # processes_xxx
        #
        # servers.HOST.processes.fork_rate
        ####################################################
        - match: "servers.*.processes.*"
          name: "processes_${2}"
          labels:
            instance: "${1}"
            job: "truenas"

        #######################################
        # zfs_arc
        ######################################
        - match: "servers.*.zfs_arc.*"
          name: "zfs_arc_${2}"
          labels:
            instance: "${1}"
            job: "truenas"

        - match: "servers.*.zfs_arc.*.*"
          name: "zfs_arc_${2}_${3}"
          labels:
            instance: "${1}"
            job: "truenas"

        - match: "servers.*.zfs_arc.*.*.*"
          name: "zfs_arc_${2}_${3}_${4}"
          labels:
            instance: "${1}"
            job: "truenas"

        #######################################
        # rrdcached
        ######################################
        - match: "servers.*.rrdcached.*"
          name: "rrdcached_${2}"
          labels:
            instance: "${1}"
            job: "truenas"

        - match: "servers.*.rrdcached.*.*"
          name: "rrdcached_${2}_${3}"
          labels:
            instance: "${1}"
            job: "truenas"

        - match: "servers.*.rrdcached.*.*.*"
          name: "rrdcached_${2}_${3}_${4}"
          labels:
            instance: "${1}"
            job: "truenas"


        ##############################################
        # nfsstat_nfsv4_ops
        # servers.HOST.nfsstat.nfsv4_ops.nfsstat.nfsv4_op_write
        # servers.HOST.nfsstat.nfsv3_ops.nfsstat.nfsv3_op_lookup
        ##############################################
        - match: servers.*.nfsstat.*.nfsstat.*
          name: nfsstat_${2}
          labels:
            instance: "${1}"
            job: "truenas"
            op: "$3"

        ############################################################
        # nfsstat_server
        # servers.HOST.nfsstat.server.nfsstat.fh_stale
        ###########################################################
        - match: servers.*.nfsstat.server.nfsstat.*
          name: nfsstat_server
          labels:
            instance: "${1}"
            job: "truenas"
            stat: "${2}"

        ##############################################
        # Load
        # servers.HOST.load.load.shortterm
        # servers.HOST.load.load.midterm
        # servers.HOST.load.load.longterm
        #############################################
        - match: "servers.*.load.load.*"
          name: "load_average"
          labels:
            instance: "${1}"
            job: "truenas"
            period: "${2}"

        ################################################################
        # interface
        # servers.HOST.interface.kube-dummy-if.if_dropped.rx
        ################################################################
        - match: servers.*.interface.*.*.*
          name: interface_${3}
          labels:
            instance: ${1}
            job: truenas
            iface: ${2}
            direction: ${4}


        ####################
        # Generic fallbacks
        ####################

        - match: "servers.*.*.*"
          name: "${2}_${3}"
          labels:
            instance: "${1}"
            job: "truenas"
            fallback_match: "1"
            type: "${2}"

        - match: "servers.*.*.*.*"
          name: "${2}_${3}_${4}"
          labels:
            instance: "${1}"
            job: "truenas"
            fallback_match: "2"
            type: "${2}"

        - match: "servers.*.*.*.*.*"
          name: "${2}_${3}_${4}_${5}"
          labels:
            instance: "${1}"
            job: "truenas"
            fallback_match: "3"
            type: "${2}"

        - match: "servers.*.*.*.*.*.*"
          name: "${2}_${3}_${4}_${5}_${6}"
          labels:
            instance: "${1}"
            job: "truenas"
            type: "${2}"
            fallback_match: "4"
      require: Btrfs::Subvolume[/srv/graphite-exporter]
      notify: Docker::Run[graphite-exporter]
    "/srv/otelcol/config.yaml":
      ensure: present
      content: |
        receivers:
          otlp:
            protocols:
              http:
                endpoint: 0.0.0.0:4318

        exporters:
          otlphttp:
            endpoint: https://tempo-otelhttp.srv.gentoomaniac.net:4318

        service:
          telemetry:
            logs:
              level: "INFO"
              development: false
              encoding: "json"
          pipelines:
            traces:
              receivers: [otlp]
              exporters: [otlphttp]
      require: Btrfs::Subvolume[/srv/otelcol]
      notify: Docker::Run[otelcol]
