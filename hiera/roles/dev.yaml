---
classes:
  - docker::networks
  - docker::run_instance
  - traefik

resources:
  btrfs::subvolume:
    "/srv/forgejo":
      ensure: present
    "/srv/gitea":
      ensure: present
    "/srv/trilium":
      ensure: present
    "/srv/wor-timeline":
      ensure: present
  file:
    /srv/forgejo/data:
      ensure: directory
      owner: 1000
      group: 1000
      require: Btrfs::Subvolume[/srv/forgejo]
    /srv/gitea/data:
      ensure: directory
      owner: 1000
      group: 1000
      require: Btrfs::Subvolume[/srv/gitea]

docker::docker_users:
  - marco

traefik::certificates:
  srv_gentoomaniac_net:
    cert: secret_srv_gentoomaniac_net_cert
    key: secret_srv_gentoomaniac_net_key
  gentoomaniac_net:
    cert: secret_gentoomaniac_net_cert
    key: secret_gentoomaniac_net_key
traefik::default_certificate: srv_gentoomaniac_net
traefik::entrypoints:
  websecure: ":443"
  git: ":222"
  forgejo-git: ":2222"
  public: ":45802"
traefik::ports:
  - 443:443/tcp
  - 222:222/tcp
  - 2222:2222/tcp
  - 45802:45802/tcp
traefik::dynamic_configs:
  "wor-timeline-auth.toml": |
    [http.middlewares.wor-timeline-auth.basicAuth]
      users = [
        "%{lookup('secret_wor_timeline_htpasswd')}",
      ]

docker::networks::networks:
  web:
    ensure: "present"

docker::run_instance::instance:
  # runs next to gitea until the repos are migrated, then takes over git.srv.gentoomaniac.net;
  # first visit shows the install page (LAN only) to create the admin account
  forgejo:
    service_provider: systemd
    # LTS line, supported until 2027-07-15; the major tag picks up its patch releases
    image: codeberg.org/forgejo/forgejo:15
    env:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__server__DOMAIN=forgejo.srv.gentoomaniac.net
      - FORGEJO__server__ROOT_URL=https://forgejo.srv.gentoomaniac.net/
      - FORGEJO__server__SSH_DOMAIN=forgejo.srv.gentoomaniac.net
      # traefik can't route plain TCP by host, so forgejo's SSH gets its own port until the switch
      - FORGEJO__server__SSH_PORT=2222
      - FORGEJO__server__SSH_LISTEN_PORT=22
      - FORGEJO__database__DB_TYPE=sqlite3
      - FORGEJO__service__DISABLE_REGISTRATION=true
    expose:
      - "3000"
      - "22"
    extra_parameters:
      - --restart=unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.forgejo.rule=Host(`forgejo.srv.gentoomaniac.net`)
      - traefik.http.routers.forgejo.entrypoints=websecure
      - traefik.http.routers.forgejo.tls=true
      - traefik.http.middlewares.forgejo-allowlist.ipallowlist.sourcerange=10.1.1.0/24,192.168.0.0/16
      - traefik.http.routers.forgejo.middlewares=forgejo-allowlist
      - traefik.http.services.forgejo.loadbalancer.server.port=3000
      - traefik.tcp.routers.forgejossh.entrypoints=forgejo-git
      - traefik.tcp.routers.forgejossh.rule=HostSNI(`*`)
      - traefik.tcp.services.forgejossh.loadbalancer.server.port=22
      - traefik.tcp.middlewares.forgejo-ssh-allowlist.ipallowlist.sourcerange=10.1.1.0/24,192.168.0.0/16
      - traefik.tcp.routers.forgejossh.middlewares=forgejo-ssh-allowlist
    net:
      - web
    pull_on_start: true
    volumes:
      - /srv/forgejo/data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    require:
      - Class[docker]
      - File[/srv/forgejo/data]
  gitea:
    service_provider: systemd
    image: docker.gitea.com/gitea:1.25
    env:
      - USER_UID=1000
      - USER_GID=1000
      - SSH_DOMAIN=git.srv.gentoomaniac.net
      - SSH_PORT=222
      - SSH_LISTEN_PORT=22
    expose:
      - "3000"
      - "22"
    extra_parameters:
      - --restart=unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.gitea.rule=Host(`git.srv.gentoomaniac.net`)
      - traefik.http.routers.gitea.entrypoints=websecure
      - traefik.http.routers.gitea.tls=true
      - traefik.http.middlewares.gitea-whitelist.ipallowlist.sourcerange=10.1.1.0/24,192.168.0.0/16
      - traefik.http.routers.gitea.middlewares=gitea-whitelist
      - traefik.http.services.gitea.loadbalancer.server.port=3000
      - traefik.tcp.routers.gitssh.entrypoints=git
      - traefik.tcp.routers.gitssh.rule=HostSNI(`*`)
      - traefik.tcp.services.gitssh.loadbalancer.server.port=22
      - traefik.tcp.middlewares.gitea-ssh-whitelist.ipallowlist.sourcerange=10.1.1.0/24,192.168.0.0/16
      - traefik.tcp.routers.gitssh.middlewares=gitea-ssh-whitelist
    net:
      - web
    pull_on_start: true
    volumes:
      - /srv/gitea/data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    require:
      - Class[docker]
      - File[/srv/gitea/data]
  trilium:
    service_provider: systemd
    image: triliumnext/notes:stable
    env:
      - USER_UID=1000
      - USER_GID=1000
    expose:
      - "8080"
    extra_parameters:
      - --restart=unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.trilium.rule=Host(`trilium.srv.gentoomaniac.net`)
      - traefik.http.routers.trilium.entrypoints=websecure
      - traefik.http.routers.trilium.tls=true
      - traefik.http.middlewares.trilium-whitelist.ipallowlist.sourcerange=10.1.1.0/24,192.168.0.0/16
      - traefik.http.routers.trilium.middlewares=trilium-whitelist
      - traefik.http.services.trilium.loadbalancer.server.port=8080
    net:
      - web
    pull_on_start: true
    volumes:
      - /srv/trilium:/home/node/trilium-data
    require:
      - Class[docker]
      - Btrfs::Subvolume[/srv/trilium]

  wor-timeline:
    service_provider: systemd
    image: nginx:stable-alpine
    expose:
      - "80"
    extra_parameters:
      - --restart=unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.wor-timeline.rule=Host(`wor-timeline.srv.gentoomaniac.net`)
      - traefik.http.routers.wor-timeline.entrypoints=websecure
      - traefik.http.routers.wor-timeline.tls=true
      - traefik.http.routers.wor-timeline.middlewares=wor-timeline-auth@file
      - traefik.http.routers.wor-timeline.service=wor-timeline
      - traefik.http.routers.wor-timeline-public.rule=Host(`wor-timeline.gentoomaniac.net`)
      - traefik.http.routers.wor-timeline-public.entrypoints=public
      - traefik.http.routers.wor-timeline-public.tls=true
      - traefik.http.routers.wor-timeline-public.middlewares=wor-timeline-auth@file
      - traefik.http.routers.wor-timeline-public.service=wor-timeline
      - traefik.http.services.wor-timeline.loadbalancer.server.port=80
    net:
      - web
    pull_on_start: true
    volumes:
      - /srv/wor-timeline:/usr/share/nginx/html:ro
    require:
      - Class[docker]
      - Btrfs::Subvolume[/srv/wor-timeline]
      - File[/srv/traefik/conf/wor-timeline-auth.toml]
