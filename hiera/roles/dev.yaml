---
classes:
  - docker::networks
  - docker::volumes
  - docker::run_instance
  - traefik

resources:
  package:
    # mount helper for the NFS docker volume (nfs_photos)
    nfs-utils:
      ensure: installed
  btrfs::subvolume:
    "/srv/agent-bus":
      ensure: present
    "/srv/forgejo":
      ensure: present
    # one-off removal of gitea with all its data, after the container is gone;
    # drop together with the gitea container entry once applied on dev
    "/srv/gitea":
      ensure: absent
      require: Docker::Run[gitea]
    "/srv/immich":
      ensure: present
    "/srv/roundcube":
      ensure: present
    "/srv/trilium":
      ensure: present
    "/srv/wor-timeline":
      ensure: present
  file:
    # agent-messenger: the image runs as uid 10001. config holds the CA key and the admin logins,
    # monitor-config only what the web monitor needs (agent-busctl monitor init)
    /srv/agent-bus/config:
      ensure: directory
      owner: 10001
      group: 10001
      mode: "0700"
      require: Btrfs::Subvolume[/srv/agent-bus]
    /srv/agent-bus/data:
      ensure: directory
      owner: 10001
      group: 10001
      mode: "0700"
      require: Btrfs::Subvolume[/srv/agent-bus]
    /srv/agent-bus/monitor-config:
      ensure: directory
      owner: 10001
      group: 10001
      mode: "0700"
      require: Btrfs::Subvolume[/srv/agent-bus]
    /srv/forgejo/data:
      ensure: directory
      owner: 1000
      group: 1000
      require: Btrfs::Subvolume[/srv/forgejo]
    # immich-server runs as root; regenerable media stays on the local disk, mounted over the
    # NAS library at /data/encoded-video and /data/thumbs (fast, read constantly by the timeline)
    /srv/immich/encoded-video:
      ensure: directory
      require: Btrfs::Subvolume[/srv/immich]
    # the library before it moved to the NAS (nfs_photos); kept as a fallback for now
    /srv/immich/library:
      ensure: directory
      require: Btrfs::Subvolume[/srv/immich]
    # immich-machine-learning runs as root and downloads its models here
    /srv/immich/model-cache:
      ensure: directory
      require: Btrfs::Subvolume[/srv/immich]
    # no owner override: the postgres image's entrypoint runs as root and
    # chowns this to its own postgres user before starting the server
    /srv/immich/postgres:
      ensure: directory
      require: Btrfs::Subvolume[/srv/immich]
    /srv/immich/thumbs:
      ensure: directory
      require: Btrfs::Subvolume[/srv/immich]
    # the apache image runs roundcube as www-data
    /srv/roundcube/db:
      ensure: directory
      owner: 33
      group: 33
      require: Btrfs::Subvolume[/srv/roundcube]

docker::docker_users:
  - marco

traefik::certificates:
  srv_gentoomaniac_net:
    cert: secret_srv_gentoomaniac_net_cert
    key: secret_srv_gentoomaniac_net_key
  gentoomaniac_net:
    cert: secret_gentoomaniac_net_cert
    key: secret_gentoomaniac_net_key
traefik::default_certificate: srv_gentoomaniac_net
traefik::entrypoints:
  websecure: ":443"
  git: ":222"
  # Forgejo's SSH port before it took over git.srv; drop once no remote uses :2222 anymore
  forgejo-git: ":2222"
  public: ":45802"
traefik::ports:
  - 443:443/tcp
  - 222:222/tcp
  - 2222:2222/tcp
  - 45802:45802/tcp
# Traefik v3 cuts requests whose body isn't read within 60s; large Immich uploads (videos, many
# in parallel on a busy host) take longer, so websecure allows 30 min. Public traffic uses the
# `public` entrypoint, which keeps the 60s default.
traefik::extra_args:
  - --entryPoints.websecure.transport.respondingTimeouts.readTimeout=30m
traefik::dynamic_configs:
  "wor-timeline-auth.toml": |
    [http.middlewares.wor-timeline-auth.basicAuth]
      users = [
        "%{lookup('secret_wor_timeline_htpasswd')}",
      ]

docker::networks::networks:
  immich:
    ensure: "present"
  web:
    ensure: "present"

# NAS share for Immich over the direct fiber link (ens19, 192.168.0.0/24), mounted by docker on
# container start. `hard`, unlike the read-mostly media shares: a soft mount can silently lose
# writes during an NFS hiccup, and this becomes the library.
docker::volumes::volumes:
  nfs_photos:
    ensure: present
    driver: local
    options:
      - - type=nfs
        - o=addr=192.168.0.5,nolock,hard,bg,tcp,intr,rsize=131072,wsize=131072,noatime,rw
        - device=:/mnt/tank0/photos

docker::run_instance::instance:
  # agent-messenger broker (nats-server and busd). Agents connect straight to the published ports:
  # 4222 password and enrollment logins, 4223 certificate logins; both are TLS with the bus's own CA,
  # so they bypass Traefik. One-time setup before the first start: see the agent-messenger docs
  # (docs/podman.md, with docker run as root instead of podman's --userns).
  agent-bus:
    service_provider: systemd
    image: ghcr.io/gentoomaniac/agent-messenger:0.3.2
    env:
      # the monitor's agent manages every channel (invite, remove, update)
      - BUSD_BUS_OWNER=monitor@gentoomaniac
    ports:
      - 4222:4222/tcp
      - 4223:4223/tcp
    extra_parameters:
      - --restart=unless-stopped
    net:
      - web
    pull_on_start: true
    volumes:
      - /srv/agent-bus/config:/config
      - /srv/agent-bus/data:/data
    require:
      - Class[docker]
      - File[/srv/agent-bus/config]
      - File[/srv/agent-bus/data]
  # its web monitor behind Traefik; it reaches the broker as agent-bus on the web network, so the
  # broker certificate needs that name (tls init --san agent-bus)
  agent-bus-monitor:
    service_provider: systemd
    image: ghcr.io/gentoomaniac/agent-messenger:0.3.2
    env:
      - BUS_BROKER=agent-bus:4222
      - BUS_AGENT=monitor@gentoomaniac
      - BUS_WEB_LISTEN=0.0.0.0:8080
      - BUS_WEB_BEHIND_PROXY=true
      - BUS_WEB_PUBLIC_URL=https://agent-bus.srv.gentoomaniac.net
      # Traefik's address on the docker network
      - BUS_WEB_TRUSTED_PROXY=172.16.0.0/12
    expose:
      - "8080"
    extra_parameters:
      - --restart=unless-stopped
      - --entrypoint=bus-monitor
    # info level: since 0.3.1 the monitor logs only errors by default
    command: "-vv"
    labels:
      - traefik.enable=true
      - traefik.http.routers.agent-bus.rule=Host(`agent-bus.srv.gentoomaniac.net`)
      - traefik.http.routers.agent-bus.entrypoints=websecure
      - traefik.http.routers.agent-bus.tls=true
      - traefik.http.middlewares.agent-bus-allowlist.ipallowlist.sourcerange=10.1.1.0/24,192.168.0.0/16
      - traefik.http.routers.agent-bus.middlewares=agent-bus-allowlist
      - traefik.http.services.agent-bus.loadbalancer.server.port=8080
    net:
      - web
    pull_on_start: true
    volumes:
      - /srv/agent-bus/monitor-config:/config
    require:
      - Class[docker]
      - File[/srv/agent-bus/monitor-config]
      - Docker::Run[agent-bus]
  # replaced gitea at git.srv.gentoomaniac.net; forgejo.srv.gentoomaniac.net still answers for old links
  forgejo:
    service_provider: systemd
    # LTS line, supported until 2027-07-15; the major tag picks up its patch releases
    image: codeberg.org/forgejo/forgejo:15
    env:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__server__DOMAIN=git.srv.gentoomaniac.net
      - FORGEJO__server__ROOT_URL=https://git.srv.gentoomaniac.net/
      - FORGEJO__server__SSH_DOMAIN=git.srv.gentoomaniac.net
      - FORGEJO__server__SSH_PORT=222
      - FORGEJO__server__SSH_LISTEN_PORT=22
      - FORGEJO__database__DB_TYPE=sqlite3
      - FORGEJO__service__DISABLE_REGISTRATION=true
    expose:
      - "3000"
      - "22"
    extra_parameters:
      - --restart=unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.forgejo.rule=Host(`git.srv.gentoomaniac.net`) || Host(`forgejo.srv.gentoomaniac.net`)
      - traefik.http.routers.forgejo.entrypoints=websecure
      - traefik.http.routers.forgejo.tls=true
      - traefik.http.middlewares.forgejo-allowlist.ipallowlist.sourcerange=10.1.1.0/24,192.168.0.0/16
      - traefik.http.routers.forgejo.middlewares=forgejo-allowlist
      - traefik.http.services.forgejo.loadbalancer.server.port=3000
      - traefik.tcp.routers.forgejossh.entrypoints=git,forgejo-git
      - traefik.tcp.routers.forgejossh.rule=HostSNI(`*`)
      - traefik.tcp.services.forgejossh.loadbalancer.server.port=22
      - traefik.tcp.middlewares.forgejo-ssh-allowlist.ipallowlist.sourcerange=10.1.1.0/24,192.168.0.0/16
      - traefik.tcp.routers.forgejossh.middlewares=forgejo-ssh-allowlist
    net:
      - web
    pull_on_start: true
    volumes:
      - /srv/forgejo/data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    require:
      - Class[docker]
      - File[/srv/forgejo/data]
  # one-off removal, see /srv/gitea above; Forgejo replaces it
  gitea:
    ensure: absent
    service_provider: systemd
    image: docker.gitea.com/gitea:1.25
  immich-machine-learning:
    service_provider: systemd
    image: ghcr.io/immich-app/immich-machine-learning:v3
    env:
      - MACHINE_LEARNING_MODEL_REVISION=v2
      # unused by the ML service itself, kept for parity with upstream's shared .env
      - DB_PASSWORD=%{lookup('secret_immich_db_password')}
      - DB_USERNAME=postgres
      - DB_DATABASE_NAME=immich
    extra_parameters:
      - --restart=unless-stopped
    net:
      - immich
    pull_on_start: true
    volumes:
      - /srv/immich/model-cache:/cache
    require:
      - Class[docker]
      - Docker_network[immich]
      - File[/srv/immich/model-cache]
  immich-postgres:
    service_provider: systemd
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    env:
      - POSTGRES_PASSWORD=%{lookup('secret_immich_db_password')}
      - POSTGRES_USER=postgres
      - POSTGRES_DB=immich
      - POSTGRES_INITDB_ARGS=--data-checksums
    extra_parameters:
      - --restart=unless-stopped
      - --shm-size=128m
    net:
      - immich
    pull_on_start: true
    volumes:
      - /srv/immich/postgres:/var/lib/postgresql/data
    require:
      - Class[docker]
      - Docker_network[immich]
      - File[/srv/immich/postgres]
  immich-redis:
    service_provider: systemd
    # pinned to upstream's tested digest, like the postgres image above
    image: docker.io/valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    extra_parameters:
      - --restart=unless-stopped
    net:
      - immich
    pull_on_start: true
    require:
      - Class[docker]
      - Docker_network[immich]
  immich-server:
    service_provider: systemd
    # upstream's recommended floating major tag
    image: ghcr.io/immich-app/immich-server:v3
    env:
      # the container names above instead of compose's "database"/"redis" service names
      - DB_HOSTNAME=immich-postgres
      - DB_PASSWORD=%{lookup('secret_immich_db_password')}
      - DB_USERNAME=postgres
      - DB_DATABASE_NAME=immich
      - REDIS_HOSTNAME=immich-redis
      - IMMICH_MACHINE_LEARNING_URL=http://immich-machine-learning:3003
    expose:
      - "2283"
    extra_parameters:
      - --restart=unless-stopped
    labels:
      - traefik.enable=true
      # disambiguates which of this container's two networks Traefik should reach it on
      - traefik.docker.network=web
      - traefik.http.routers.immich.rule=Host(`immich.srv.gentoomaniac.net`)
      - traefik.http.routers.immich.entrypoints=websecure
      - traefik.http.routers.immich.tls=true
      - traefik.http.middlewares.immich-allowlist.ipallowlist.sourcerange=10.1.1.0/24,192.168.0.0/16
      - traefik.http.routers.immich.middlewares=immich-allowlist
      - traefik.http.services.immich.loadbalancer.server.port=2283
    net:
      - immich
      - web
    pull_on_start: true
    volumes:
      # originals, profile images and DB backups on the NAS; docker mounts the nested local
      # dirs on top of it, so thumbnails and transcoded videos stay on dev's disk
      - nfs_photos:/data
      - /srv/immich/encoded-video:/data/encoded-video
      - /srv/immich/thumbs:/data/thumbs
      - /etc/localtime:/etc/localtime:ro
    require:
      - Class[docker]
      - Docker_network[immich]
      - File[/srv/immich/encoded-video]
      - File[/srv/immich/thumbs]
      - Package[nfs-utils]
      - Docker_volume[nfs_photos]
      - Docker::Run[immich-postgres]
      - Docker::Run[immich-redis]
  # webmail for Gmail: log in with the Google address and an app password, which
  # roundcube also uses for SMTP. No fixed des_key: sessions end when the container is recreated.
  roundcube:
    service_provider: systemd
    # floating 1.7 tag, picks up 1.7.x and base image updates
    image: roundcube/roundcubemail:1.7.x-apache
    env:
      - ROUNDCUBEMAIL_DEFAULT_HOST=ssl://imap.gmail.com
      - ROUNDCUBEMAIL_DEFAULT_PORT=993
      - ROUNDCUBEMAIL_SMTP_SERVER=tls://smtp.gmail.com
      - ROUNDCUBEMAIL_SMTP_PORT=587
      - ROUNDCUBEMAIL_DB_TYPE=sqlite
      # Gmail's attachment limit
      - ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE=25M
    expose:
      - "80"
    extra_parameters:
      - --restart=unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.roundcube.rule=Host(`roundcube.srv.gentoomaniac.net`)
      - traefik.http.routers.roundcube.entrypoints=websecure
      - traefik.http.routers.roundcube.tls=true
      - traefik.http.middlewares.roundcube-allowlist.ipallowlist.sourcerange=10.1.1.0/24,192.168.0.0/16
      - traefik.http.routers.roundcube.middlewares=roundcube-allowlist
      - traefik.http.services.roundcube.loadbalancer.server.port=80
    net:
      - web
    pull_on_start: true
    volumes:
      - /srv/roundcube/db:/var/roundcube/db
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    require:
      - Class[docker]
      - File[/srv/roundcube/db]
  trilium:
    service_provider: systemd
    image: triliumnext/notes:stable
    env:
      - USER_UID=1000
      - USER_GID=1000
    expose:
      - "8080"
    extra_parameters:
      - --restart=unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.trilium.rule=Host(`trilium.srv.gentoomaniac.net`)
      - traefik.http.routers.trilium.entrypoints=websecure
      - traefik.http.routers.trilium.tls=true
      - traefik.http.middlewares.trilium-whitelist.ipallowlist.sourcerange=10.1.1.0/24,192.168.0.0/16
      - traefik.http.routers.trilium.middlewares=trilium-whitelist
      - traefik.http.services.trilium.loadbalancer.server.port=8080
    net:
      - web
    pull_on_start: true
    volumes:
      - /srv/trilium:/home/node/trilium-data
    require:
      - Class[docker]
      - Btrfs::Subvolume[/srv/trilium]

  wor-timeline:
    service_provider: systemd
    image: nginx:stable-alpine
    expose:
      - "80"
    extra_parameters:
      - --restart=unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.wor-timeline.rule=Host(`wor-timeline.srv.gentoomaniac.net`)
      - traefik.http.routers.wor-timeline.entrypoints=websecure
      - traefik.http.routers.wor-timeline.tls=true
      - traefik.http.routers.wor-timeline.middlewares=wor-timeline-auth@file
      - traefik.http.routers.wor-timeline.service=wor-timeline
      - traefik.http.routers.wor-timeline-public.rule=Host(`wor-timeline.gentoomaniac.net`)
      - traefik.http.routers.wor-timeline-public.entrypoints=public
      - traefik.http.routers.wor-timeline-public.tls=true
      - traefik.http.routers.wor-timeline-public.middlewares=wor-timeline-auth@file
      - traefik.http.routers.wor-timeline-public.service=wor-timeline
      - traefik.http.services.wor-timeline.loadbalancer.server.port=80
    net:
      - web
    pull_on_start: true
    volumes:
      - /srv/wor-timeline:/usr/share/nginx/html:ro
    require:
      - Class[docker]
      - Btrfs::Subvolume[/srv/wor-timeline]
      - File[/srv/traefik/conf/wor-timeline-auth.toml]
