---
classes:
  - docker::networks
  - docker::run_instance
  - traefik

resources:
  btrfs::subvolume:
    "/srv/forgejo":
      ensure: present
    "/srv/gitea":
      ensure: present
    "/srv/immich":
      ensure: present
    "/srv/roundcube":
      ensure: present
    "/srv/trilium":
      ensure: present
    "/srv/wor-timeline":
      ensure: present
  file:
    /srv/forgejo/data:
      ensure: directory
      owner: 1000
      group: 1000
      require: Btrfs::Subvolume[/srv/forgejo]
    /srv/gitea/data:
      ensure: directory
      owner: 1000
      group: 1000
      require: Btrfs::Subvolume[/srv/gitea]
    # immich-server runs as root and writes the originals here directly
    /srv/immich/library:
      ensure: directory
      require: Btrfs::Subvolume[/srv/immich]
    # immich-machine-learning runs as root and downloads its models here
    /srv/immich/model-cache:
      ensure: directory
      require: Btrfs::Subvolume[/srv/immich]
    # no owner override: the postgres image's entrypoint runs as root and
    # chowns this to its own postgres user before starting the server
    /srv/immich/postgres:
      ensure: directory
      require: Btrfs::Subvolume[/srv/immich]
    # the apache image runs roundcube as www-data
    /srv/roundcube/db:
      ensure: directory
      owner: 33
      group: 33
      require: Btrfs::Subvolume[/srv/roundcube]

docker::docker_users:
  - marco

traefik::certificates:
  srv_gentoomaniac_net:
    cert: secret_srv_gentoomaniac_net_cert
    key: secret_srv_gentoomaniac_net_key
  gentoomaniac_net:
    cert: secret_gentoomaniac_net_cert
    key: secret_gentoomaniac_net_key
traefik::default_certificate: srv_gentoomaniac_net
traefik::entrypoints:
  websecure: ":443"
  git: ":222"
  forgejo-git: ":2222"
  public: ":45802"
traefik::ports:
  - 443:443/tcp
  - 222:222/tcp
  - 2222:2222/tcp
  - 45802:45802/tcp
traefik::dynamic_configs:
  "wor-timeline-auth.toml": |
    [http.middlewares.wor-timeline-auth.basicAuth]
      users = [
        "%{lookup('secret_wor_timeline_htpasswd')}",
      ]

docker::networks::networks:
  immich:
    ensure: "present"
  web:
    ensure: "present"

docker::run_instance::instance:
  # runs next to gitea until the repos are migrated, then takes over git.srv.gentoomaniac.net;
  # first visit shows the install page (LAN only) to create the admin account
  forgejo:
    service_provider: systemd
    # LTS line, supported until 2027-07-15; the major tag picks up its patch releases
    image: codeberg.org/forgejo/forgejo:15
    env:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__server__DOMAIN=forgejo.srv.gentoomaniac.net
      - FORGEJO__server__ROOT_URL=https://forgejo.srv.gentoomaniac.net/
      - FORGEJO__server__SSH_DOMAIN=forgejo.srv.gentoomaniac.net
      # traefik can't route plain TCP by host, so forgejo's SSH gets its own port until the switch
      - FORGEJO__server__SSH_PORT=2222
      - FORGEJO__server__SSH_LISTEN_PORT=22
      - FORGEJO__database__DB_TYPE=sqlite3
      - FORGEJO__service__DISABLE_REGISTRATION=true
    expose:
      - "3000"
      - "22"
    extra_parameters:
      - --restart=unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.forgejo.rule=Host(`forgejo.srv.gentoomaniac.net`)
      - traefik.http.routers.forgejo.entrypoints=websecure
      - traefik.http.routers.forgejo.tls=true
      - traefik.http.middlewares.forgejo-allowlist.ipallowlist.sourcerange=10.1.1.0/24,192.168.0.0/16
      - traefik.http.routers.forgejo.middlewares=forgejo-allowlist
      - traefik.http.services.forgejo.loadbalancer.server.port=3000
      - traefik.tcp.routers.forgejossh.entrypoints=forgejo-git
      - traefik.tcp.routers.forgejossh.rule=HostSNI(`*`)
      - traefik.tcp.services.forgejossh.loadbalancer.server.port=22
      - traefik.tcp.middlewares.forgejo-ssh-allowlist.ipallowlist.sourcerange=10.1.1.0/24,192.168.0.0/16
      - traefik.tcp.routers.forgejossh.middlewares=forgejo-ssh-allowlist
    net:
      - web
    pull_on_start: true
    volumes:
      - /srv/forgejo/data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    require:
      - Class[docker]
      - File[/srv/forgejo/data]
  gitea:
    service_provider: systemd
    image: docker.gitea.com/gitea:1.25
    env:
      - USER_UID=1000
      - USER_GID=1000
      - SSH_DOMAIN=git.srv.gentoomaniac.net
      - SSH_PORT=222
      - SSH_LISTEN_PORT=22
    expose:
      - "3000"
      - "22"
    extra_parameters:
      - --restart=unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.gitea.rule=Host(`git.srv.gentoomaniac.net`)
      - traefik.http.routers.gitea.entrypoints=websecure
      - traefik.http.routers.gitea.tls=true
      - traefik.http.middlewares.gitea-whitelist.ipallowlist.sourcerange=10.1.1.0/24,192.168.0.0/16
      - traefik.http.routers.gitea.middlewares=gitea-whitelist
      - traefik.http.services.gitea.loadbalancer.server.port=3000
      - traefik.tcp.routers.gitssh.entrypoints=git
      - traefik.tcp.routers.gitssh.rule=HostSNI(`*`)
      - traefik.tcp.services.gitssh.loadbalancer.server.port=22
      - traefik.tcp.middlewares.gitea-ssh-whitelist.ipallowlist.sourcerange=10.1.1.0/24,192.168.0.0/16
      - traefik.tcp.routers.gitssh.middlewares=gitea-ssh-whitelist
    net:
      - web
    pull_on_start: true
    volumes:
      - /srv/gitea/data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    require:
      - Class[docker]
      - File[/srv/gitea/data]
  # self-hosted photo library, under test; DNS for immich.srv.gentoomaniac.net is
  # managed outside this repo
  immich-machine-learning:
    service_provider: systemd
    image: ghcr.io/immich-app/immich-machine-learning:v3
    env:
      - MACHINE_LEARNING_MODEL_REVISION=v2
      # unused by the ML service itself, kept for parity with upstream's shared .env
      - DB_PASSWORD=%{lookup('secret_immich_db_password')}
      - DB_USERNAME=postgres
      - DB_DATABASE_NAME=immich
    extra_parameters:
      - --restart=unless-stopped
    net:
      - immich
    pull_on_start: true
    volumes:
      - /srv/immich/model-cache:/cache
    require:
      - Class[docker]
      - Docker_network[immich]
      - File[/srv/immich/model-cache]
  immich-postgres:
    service_provider: systemd
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    env:
      - POSTGRES_PASSWORD=%{lookup('secret_immich_db_password')}
      - POSTGRES_USER=postgres
      - POSTGRES_DB=immich
      - POSTGRES_INITDB_ARGS=--data-checksums
    extra_parameters:
      - --restart=unless-stopped
      - --shm-size=128m
    net:
      - immich
    pull_on_start: true
    volumes:
      - /srv/immich/postgres:/var/lib/postgresql/data
    require:
      - Class[docker]
      - Docker_network[immich]
      - File[/srv/immich/postgres]
  immich-redis:
    service_provider: systemd
    # pinned to upstream's tested digest, like the postgres image above
    image: docker.io/valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    extra_parameters:
      - --restart=unless-stopped
    net:
      - immich
    pull_on_start: true
    require:
      - Class[docker]
      - Docker_network[immich]
  immich-server:
    service_provider: systemd
    # upstream's recommended floating major tag
    image: ghcr.io/immich-app/immich-server:v3
    env:
      # the container names above instead of compose's "database"/"redis" service names
      - DB_HOSTNAME=immich-postgres
      - DB_PASSWORD=%{lookup('secret_immich_db_password')}
      - DB_USERNAME=postgres
      - DB_DATABASE_NAME=immich
      - REDIS_HOSTNAME=immich-redis
      - IMMICH_MACHINE_LEARNING_URL=http://immich-machine-learning:3003
    expose:
      - "2283"
    extra_parameters:
      - --restart=unless-stopped
    labels:
      - traefik.enable=true
      # disambiguates which of this container's two networks Traefik should reach it on
      - traefik.docker.network=web
      - traefik.http.routers.immich.rule=Host(`immich.srv.gentoomaniac.net`)
      - traefik.http.routers.immich.entrypoints=websecure
      - traefik.http.routers.immich.tls=true
      - traefik.http.middlewares.immich-allowlist.ipallowlist.sourcerange=10.1.1.0/24,192.168.0.0/16
      - traefik.http.routers.immich.middlewares=immich-allowlist
      - traefik.http.services.immich.loadbalancer.server.port=2283
    net:
      - immich
      - web
    pull_on_start: true
    volumes:
      - /srv/immich/library:/data
      - /etc/localtime:/etc/localtime:ro
    require:
      - Class[docker]
      - Docker_network[immich]
      - File[/srv/immich/library]
      - Docker::Run[immich-postgres]
      - Docker::Run[immich-redis]
  # webmail for Gmail: log in with the Google address and an app password, which
  # roundcube also uses for SMTP. No fixed des_key: sessions end when the container is recreated.
  roundcube:
    service_provider: systemd
    # floating 1.7 tag, picks up 1.7.x and base image updates
    image: roundcube/roundcubemail:1.7.x-apache
    env:
      - ROUNDCUBEMAIL_DEFAULT_HOST=ssl://imap.gmail.com
      - ROUNDCUBEMAIL_DEFAULT_PORT=993
      - ROUNDCUBEMAIL_SMTP_SERVER=tls://smtp.gmail.com
      - ROUNDCUBEMAIL_SMTP_PORT=587
      - ROUNDCUBEMAIL_DB_TYPE=sqlite
      # Gmail's attachment limit
      - ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE=25M
    expose:
      - "80"
    extra_parameters:
      - --restart=unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.roundcube.rule=Host(`roundcube.srv.gentoomaniac.net`)
      - traefik.http.routers.roundcube.entrypoints=websecure
      - traefik.http.routers.roundcube.tls=true
      - traefik.http.middlewares.roundcube-allowlist.ipallowlist.sourcerange=10.1.1.0/24,192.168.0.0/16
      - traefik.http.routers.roundcube.middlewares=roundcube-allowlist
      - traefik.http.services.roundcube.loadbalancer.server.port=80
    net:
      - web
    pull_on_start: true
    volumes:
      - /srv/roundcube/db:/var/roundcube/db
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    require:
      - Class[docker]
      - File[/srv/roundcube/db]
  trilium:
    service_provider: systemd
    image: triliumnext/notes:stable
    env:
      - USER_UID=1000
      - USER_GID=1000
    expose:
      - "8080"
    extra_parameters:
      - --restart=unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.trilium.rule=Host(`trilium.srv.gentoomaniac.net`)
      - traefik.http.routers.trilium.entrypoints=websecure
      - traefik.http.routers.trilium.tls=true
      - traefik.http.middlewares.trilium-whitelist.ipallowlist.sourcerange=10.1.1.0/24,192.168.0.0/16
      - traefik.http.routers.trilium.middlewares=trilium-whitelist
      - traefik.http.services.trilium.loadbalancer.server.port=8080
    net:
      - web
    pull_on_start: true
    volumes:
      - /srv/trilium:/home/node/trilium-data
    require:
      - Class[docker]
      - Btrfs::Subvolume[/srv/trilium]

  wor-timeline:
    service_provider: systemd
    image: nginx:stable-alpine
    expose:
      - "80"
    extra_parameters:
      - --restart=unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.wor-timeline.rule=Host(`wor-timeline.srv.gentoomaniac.net`)
      - traefik.http.routers.wor-timeline.entrypoints=websecure
      - traefik.http.routers.wor-timeline.tls=true
      - traefik.http.routers.wor-timeline.middlewares=wor-timeline-auth@file
      - traefik.http.routers.wor-timeline.service=wor-timeline
      - traefik.http.routers.wor-timeline-public.rule=Host(`wor-timeline.gentoomaniac.net`)
      - traefik.http.routers.wor-timeline-public.entrypoints=public
      - traefik.http.routers.wor-timeline-public.tls=true
      - traefik.http.routers.wor-timeline-public.middlewares=wor-timeline-auth@file
      - traefik.http.routers.wor-timeline-public.service=wor-timeline
      - traefik.http.services.wor-timeline.loadbalancer.server.port=80
    net:
      - web
    pull_on_start: true
    volumes:
      - /srv/wor-timeline:/usr/share/nginx/html:ro
    require:
      - Class[docker]
      - Btrfs::Subvolume[/srv/wor-timeline]
      - File[/srv/traefik/conf/wor-timeline-auth.toml]
